name: CI

on:
  push:
    branches:
      - main
      - agent/sortable-artifact-filenames
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          architecture: x64

      - name: Create dedicated environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-lock.txt -r requirements-build.txt

      - name: Run version-controlled tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q
