name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          architecture: x64

      - name: Create dedicated environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-lock.txt -r requirements-build.txt

      - name: Build and verify Release artifacts
        shell: pwsh
        run: |
          $arguments = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            ".\scripts\build_release.ps1", "-Version", "0.1.0"
          )
          if ("${{ github.ref_type }}" -eq "tag") {
            $arguments += @("-ExpectedTag", "${{ github.ref_name }}")
          }
          & powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Upload verified Release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tokkun99Logger-v0.1.0-release-candidate
          path: |
            release/Tokkun99Logger-v0.1.0-windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  draft_release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out Release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Tokkun99Logger-v0.1.0-release-candidate
          path: release

      - name: Create Draft Release without replacing existing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = Get-Content -Raw -Encoding UTF8 packaging/RELEASE_NOTES_v0.1.0.md
          $notes = $notes.Replace("<full-commit-sha>", "${{ github.sha }}")
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP "release-notes.md"),
            $notes,
            [Text.UTF8Encoding]::new($false)
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace or mix assets"
          }
          gh release create $tag `
            --draft `
            --verify-tag `
            --title "Tokkun '99 Logger $tag" `
            --notes-file (Join-Path $env:RUNNER_TEMP "release-notes.md") `
            release/Tokkun99Logger-v0.1.0-windows-x64.zip `
            release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Draft Release creation failed" }
