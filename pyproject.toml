[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokkun99-logger"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

[project.gui-scripts]
tokkun99-logger = "tokkun99_logger.app:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
