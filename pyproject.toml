[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokkun99-logger"
dynamic = ["version"]
requires-python = ">=3.10,<3.11"

[project.gui-scripts]
tokkun99-logger = "tokkun99_logger.app:main"

[tool.setuptools.dynamic]
version = {attr = "tokkun99_logger.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
